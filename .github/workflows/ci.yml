name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**'

jobs:
  build-client:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      files: ${{ steps.step-output.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4

      - name: Create and checkout branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: git checkout -B "$BRANCH"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          cd PipePipeClient
          ./gradlew assembleDebug lintDebug --stacktrace -DskipFormatKtlint 2>&1 | tee /tmp/build.log

      - name: Show build errors if failed
        if: always()
        run: |
          echo '=== ls debug output dir ===' > /tmp/last_build_error.txt
          ls -la PipePipeClient/app/build/outputs/apk/debug/ >> /tmp/last_build_error.txt 2>&1 || true
          echo '=== ls apk root dir ===' >> /tmp/last_build_error.txt
          find PipePipeClient/app/build/outputs -iname "*.apk" >> /tmp/last_build_error.txt 2>&1 || true
          echo '=== build.log tail ===' >> /tmp/last_build_error.txt
          tail -c 8000 /tmp/build.log >> /tmp/last_build_error.txt
          git config user.email "ci@zahin-dev.local"
          git config user.name "CI Diagnostics"
          cp /tmp/last_build_error.txt last_build_error.txt
          git add last_build_error.txt
          git commit -m "CI: dump build diagnostics [skip ci]"
          git push origin HEAD:main

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-apks-in-one(intermediates)
          retention-days: 1
          path: PipePipeClient/app/build/outputs/apk/debug/*.apk

      - name: Output filenames
        id: step-output
        run: |
          files=$(ls PipePipeClient/app/build/outputs/apk/debug)
          json_array="["
          first_file=true
          for file in $files; do
            if [ "$first_file" = false ]; then
              json_array+=", \"$file\""
            else
              json_array+="\"$file\""
              first_file=false
            fi
          done
          json_array+="]"
          echo "files=$json_array"
          echo "files=$json_array" >> "$GITHUB_OUTPUT"

  publish-release:
    # Publishes a GitHub Release after every push to main, tagged with the
    # same run-number-based version the app was just built with (see
    # app/build.gradle and NewVersionWorker.kt). The in-app update checker
    # polls this repo's Releases API, so this is what makes "push new code
    # -> app detects an update" work end-to-end. Skipped on pull_request
    # builds (no release should be published for unmerged code).
    runs-on: ubuntu-latest
    needs: build-client
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: all-apks-in-one(intermediates)
          path: apks
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.1-beta${{ github.run_number }}
          name: Zahin ar YouTube 5.3.1-beta${{ github.run_number }}
          prerelease: false
          files: apks/*.apk
          generate_release_notes: true

  upload-apk:
    runs-on: ubuntu-latest
    needs: build-client
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-client.outputs.files) }}
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: all-apks-in-one(intermediates)
          path: apks
          merge-multiple: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: apks/${{ matrix.file }}
